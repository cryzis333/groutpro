<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в админ-панель — ГраутПро</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
  <div class="glass-strong" style="padding:48px;border-radius:24px;width:100%;max-width:420px">
    <div style="text-align:center;margin-bottom:40px">
      <div class="nav-logo" style="font-size:1.5rem;display:inline-block">Граут<span>Про</span> Admin</div>
    </div>
    <form id="login-form">
      <div class="form-group">
        <input type="text" id="username" placeholder="Логин" required>
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Пароль" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">Войти</button>
    </form>
  </div>
  <script src="js/admin-login.js"></script>
</body>
</html>
