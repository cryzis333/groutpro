<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="darkreader-lock">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход в админ-панель — ГраутПро</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-login-page">
  <main class="admin-login glass-strong">
    <h1 class="admin-login-title">Граут<span>Про</span> <small>Вход в админ-панель</small></h1>
    <form id="login-form" novalidate>
      <div class="admin-field">
        <label for="username">Логин</label>
        <input class="admin-input" type="text" id="username" name="username" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <div class="admin-field">
        <label for="password">Пароль</label>
        <input class="admin-input" type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <p class="admin-form-message is-error" id="login-message" role="alert"></p>
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>
  </main>
  <script src="/js/admin-login.js"></script>
</body>
</html>
