<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — ГраутПро</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav glass">
    <a href="index.html" class="nav-logo">Граут<span>Про</span></a>
    <ul class="nav-links">
      <li><a href="shop.html">← Продолжить покупки</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>

  <section class="section" style="padding-top:140px">
    <div class="container">
      <div class="grid-2">
        <div class="reveal">
          <h2 style="margin-bottom:32px;letter-spacing:-1px">Корзина</h2>
          <div id="cart-items"></div>
          <div class="cart-total" id="cart-total">0.00 ₽</div>
        </div>
        <div class="reveal">
          <form id="checkout-form" class="glass" style="padding:40px;border-radius:24px">
            <h3 style="margin-bottom:24px">Оформление заказа</h3>
            <div class="form-group">
              <input type="text" id="name" placeholder="ФИО" required>
            </div>
            <div class="form-group">
              <input type="tel" id="phone" placeholder="Телефон" required>
            </div>
            <div class="form-group">
              <input type="email" id="email" placeholder="Email">
            </div>
            <div class="form-group">
              <textarea id="address" placeholder="Адрес доставки / объект"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Оплатить через СБП</button>
            <p style="font-size:0.75rem;color:var(--muted);text-align:center;margin-top:16px">Платёж обрабатывается ЮKassa. Комиссия за перевод взимается с продавца.</p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
