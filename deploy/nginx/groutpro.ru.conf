# ГраутПро — итоговый конфиг nginx после переезда на groutpro.ru.
# Ставится вместо /etc/nginx/sites-available/groutpro (сейчас там сайт serious-company.ru).
# Порядок действий и команды — deploy/DOMAIN_MIGRATION.md. Кратко:
#
# ЭТАП 0. Зоны лимитов: deploy/nginx/groutpro-ratelimit.conf -> /etc/nginx/conf.d/
#         (limit_req_zone бывает только в http{}; без этого файла `nginx -t` для этого
#         конфига выдаст «zero size shared memory zone "groutpro_…"»).
#
# ЭТАП 1. Сертификат для groutpro.ru и www.groutpro.ru. Пока его нет, этот файл не пройдёт
#         `nginx -t`, поэтому сначала включается только HTTP-блок для проверки Let's Encrypt —
#         готовый файл deploy/nginx/groutpro.ru-stage1.conf (-> sites-available/groutpro-acme):
#
#             server {
#                 listen 80;
#                 server_name groutpro.ru www.groutpro.ru;
#                 location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
#                 location / { return 302 https://serious-company.ru$request_uri; }
#             }
#
#         затем: sudo certbot certonly --webroot -w /var/www/html -d groutpro.ru -d www.groutpro.ru \
#                     --deploy-hook "systemctl reload nginx"
#
# ЭТАП 2. Этот файл -> /etc/nginx/sites-available/groutpro, симлинк groutpro-acme удалить,
#         sudo nginx -t && sudo systemctl reload nginx.
#
# Перед установкой сверьте:
#   * каталоги сертификатов с выводом `sudo certbot certificates` (бывает serious-company.ru-0001);
#   * есть ли /etc/letsencrypt/options-ssl-nginx.conf и ssl-dhparams.pem (если нет — замените
#     две строки include/ssl_dhparam на `ssl_protocols TLSv1.2 TLSv1.3;`);
#   * IPv6: строки `listen [::]:…` закомментированы. Раскомментируйте, только если они есть
#     в текущем файле groutpro (AAAA-записи у groutpro.ru быть не должно).
#
# HTTP/2: на nginx 1.25.1+ (на сервере 1.28) включается директивой `http2 on;` внутри server.
# Старая форма `listen 443 ssl http2;` в 1.28 работает, но выдаёт предупреждение
# «the "listen ... http2" directive is deprecated». Для nginx старше 1.25.1 — наоборот:
# уберите `http2 on;` и допишите http2 в listen.
#
# Другие сайты сервера (groutprov, orders, ckan52, kay-coop) не затрагиваются: здесь нет
# default_server и *.serious-company.ru, а имена зон limit_req начинаются с groutpro_.

# ---------------------------------------------------------------------------------------------
# Порт 80: все имена -> https://groutpro.ru. Проверки Let's Encrypt (продление обоих
# сертификатов) отвечают здесь же.
server {
    listen 80;
    # listen [::]:80;
    # www.serious-company.ru добавляйте, только если у него есть DNS и его нет в других сайтах
    # (sudo nginx -T | grep server_name).
    server_name groutpro.ru www.groutpro.ru serious-company.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://groutpro.ru$request_uri;
    }
}

# ---------------------------------------------------------------------------------------------
# Основной сайт.
server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    http2 on;
    server_name groutpro.ru;

    ssl_certificate     /etc/letsencrypt/live/groutpro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groutpro.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/apps/groutpro-next/frontend;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Публичное API и так принимает не больше 2 МБ (лимит backend). Большие тела —
    # фото товаров из админки — разрешены только в /api/admin/ (55m ниже).
    client_max_body_size 2m;

    # Заголовки для статики. Backend ставит nosniff и Referrer-Policy сам, поэтому у
    # проксируемых ответов его копии скрываются (proxy_hide_header), чтобы не было дублей.
    # В location ниже нет своих add_header — иначе эти перестали бы наследоваться.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # HSTS включайте через неделю-другую стабильной работы HTTPS на groutpro.ru:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/xml application/javascript text/javascript application/json image/svg+xml;

    # Общие настройки прокси: наследуются всеми location с proxy_pass ниже
    # (в самих location proxy_set_header не задаётся — иначе наследование пропадёт).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # Ответ при превышении лимита — в том же формате, что и ошибки backend ({"error": "…"}),
    # чтобы формы показали понятный текст. Зоны — в /etc/nginx/conf.d/groutpro-ratelimit.conf.
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @groutpro_too_many;
    location @groutpro_too_many {
        default_type "application/json; charset=utf-8";
        return 429 '{"error":"Слишком много запросов. Подождите минуту и попробуйте снова."}';
    }

    # --- API (backend на 127.0.0.1:3100) ---------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3100;
        access_log off;
    }

    # Админка: фото товаров — до 10 файлов по 5 МБ, backend принимает до 50 МБ.
    location ^~ /api/admin/ {
        client_max_body_size 55m;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:3100;
    }

    location = /api/admin/login {
        limit_req zone=groutpro_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }

    location ^~ /api/auth/ {
        limit_req zone=groutpro_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }

    location = /api/contact {
        limit_req zone=groutpro_forms burst=4 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }

    # GET (список отзывов) не ограничивается — см. map в groutpro-ratelimit.conf.
    location = /api/reviews {
        limit_req zone=groutpro_forms burst=4 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }

    location = /api/orders/invoice {
        limit_req zone=groutpro_checkout burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }

    location = /api/payments/create {
        limit_req zone=groutpro_checkout burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }

    # --- Файлы ------------------------------------------------------------------------------
    # Фото товаров: имена — UUID, содержимое не меняется. С alias не используйте try_files.
    location ^~ /uploads/ {
        alias /srv/apps/groutpro-next/uploads/;
        expires 30d;
        access_log off;
    }

    # Скрытые файлы (.git, .env и т. п.) не отдаём, даже если случайно окажутся во frontend/.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # --- Страницы (чистые адреса) -----------------------------------------------------------
    # admin.js отправляет на /admin/login; /admin отдаётся правилом $uri.html ниже.
    location = /admin/login {
        try_files /admin-login.html =404;
        expires -1;
    }

    location = /admin/ {
        return 301 /admin;
    }

    # Карточка товара: /product/<uuid> (product.js понимает и /product.html?id=<uuid>).
    location ~ "^/product/[0-9a-fA-F-]{36}/?$" {
        try_files /product.html =404;
        expires -1;
    }

    # Картинки и шрифты: имена постоянные, кэш на неделю.
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # CSS и JS подключаются без версии в адресе, поэтому браузер каждый раз сверяется
    # с сервером (короткий ответ 304) и сразу получает новую выкладку.
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires -1;
    }

    # /shop -> shop.html, /cart, /account, /privacy-policy, /admin; / -> index.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }
}

# ---------------------------------------------------------------------------------------------
# www.groutpro.ru -> groutpro.ru (тот же сертификат: он выпущен на оба имени).
server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    http2 on;
    server_name www.groutpro.ru;

    ssl_certificate     /etc/letsencrypt/live/groutpro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groutpro.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://groutpro.ru$request_uri;
}

# ---------------------------------------------------------------------------------------------
# Старый домен: 301 на groutpro.ru с сохранением пути и параметров. Исключение —
# POST-уведомления ЮKassa: после 301 POST превратился бы в GET и оплата не подтвердилась бы,
# поэтому их проксируем в backend, пока в кабинете ЮKassa не сменят адрес уведомлений.
# Это безопасно: backend перепроверяет каждый платёж через API ЮKassa и не смотрит на Host.
server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    http2 on;
    # www.serious-company.ru — только если текущий сертификат его покрывает (certbot certificates).
    server_name serious-company.ru;

    # Каталог сертификата сверьте с `sudo certbot certificates` (может быть serious-company.ru-0001).
    ssl_certificate     /etc/letsencrypt/live/serious-company.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serious-company.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/payments/webhook {
        if ($request_method != POST) {
            return 301 https://groutpro.ru$request_uri;
        }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host groutpro.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 301 https://groutpro.ru$request_uri;
    }
}
