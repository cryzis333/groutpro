# Переезд на groutpro.ru, ЭТАП 1: только HTTP — чтобы выпустить сертификат Let's Encrypt.
#
# Сертификата для groutpro.ru ещё нет, а итоговый конфиг (groutpro.ru.conf) на него ссылается,
# поэтому `nginx -t` с ним не пройдёт. Сначала включается этот маленький файл:
#
#   sudo cp /srv/apps/groutpro-next/deploy/nginx/groutpro.ru-stage1.conf /etc/nginx/sites-available/groutpro-acme
#   sudo ln -s /etc/nginx/sites-available/groutpro-acme /etc/nginx/sites-enabled/groutpro-acme
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/html -d groutpro.ru -d www.groutpro.ru \
#        --deploy-hook "systemctl reload nginx"
#
# На этапе 2 симлинк удаляется: в итоговом конфиге есть свой блок :80 для этих имён
# (иначе nginx предупредит о «conflicting server name»). Подробно — deploy/DOMAIN_MIGRATION.md.
# Текущий сайт serious-company.ru этот файл не затрагивает.

server {
    listen 80;
    # listen [::]:80;   # только если в текущем файле groutpro есть listen [::]:80
    server_name groutpro.ru www.groutpro.ru;

    # Проверочные файлы Let's Encrypt (certbot --webroot кладёт их в /var/www/html).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # Пока HTTPS на новом домене нет — временно ведём посетителей на работающий сайт.
    location / {
        return 302 https://serious-company.ru$request_uri;
    }
}
