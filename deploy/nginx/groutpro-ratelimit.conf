# /etc/nginx/conf.d/groutpro-ratelimit.conf — зоны ограничения частоты запросов для ГраутПро.
#
# limit_req_zone и map разрешены только в блоке http{}. Ubuntu подключает
# /etc/nginx/conf.d/*.conf внутри http{} (проверка: grep -n conf.d /etc/nginx/nginx.conf),
# поэтому зоны лежат здесь, а директивы limit_req — в сайте /etc/nginx/sites-available/groutpro
# (deploy/nginx/groutpro.ru.conf).
#
# Сам по себе файл ничего не ограничивает: зона работает только там, где на неё ссылается
# limit_req. Его можно поставить заранее, это безопасно для всех сайтов сервера.
# Все имена начинаются с groutpro_, чтобы не пересечься с другими сайтами (groutprov, orders, …).
#
# Лимиты считаются по IP клиента. Если домашний роутер подменяет адрес (в access.log все
# запросы с 192.168.x.x), все посетители будут делить один лимит — тогда увеличьте rate
# или уберите limit_req (deploy/server-check.sh показывает, какие IP видит nginx).

# Считаются только POST. GET /api/reviews (отзывы на главной) и GET /api/auth/me
# (проверка входа на каждой странице) не ограничиваются: пустой ключ nginx не учитывает.
map $request_method $groutpro_post_client {
    POST    $binary_remote_addr;
    default "";
}

# Вход в админку: 5 попыток в минуту с одного IP (плюс burst в конфиге сайта).
limit_req_zone $groutpro_post_client zone=groutpro_admin_login:1m rate=5r/m;

# Регистрация, вход и выход покупателей (/api/auth/*).
limit_req_zone $groutpro_post_client zone=groutpro_auth:1m rate=10r/m;

# Заявки и отзывы: каждая отправка уходит уведомлением в Telegram/MAX/почту.
limit_req_zone $groutpro_post_client zone=groutpro_forms:1m rate=6r/m;

# Оформление заказа: счёт для юрлица и создание платежа ЮKassa.
limit_req_zone $groutpro_post_client zone=groutpro_checkout:1m rate=10r/m;
